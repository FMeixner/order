name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      # Der Runner hat Google Chrome vorinstalliert: kein apt-Download (Ubuntu-Spiegel fallen gelegentlich aus).
      # Nur wenn Chrome fehlt, Playwrights Chromium nachinstallieren.
      - name: Browser
        run: |
          if [ -x /usr/bin/google-chrome ]; then echo "PW_CHROMIUM=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else npx playwright install --with-deps chromium; fi
      - run: npm run e2e
