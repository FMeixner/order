name: Vorschau Single-File

# Temporärer Workflow: baut die kombinierte Vorschau (Sandsack-Bestien + Aschekurier)
# als einzelne HTML-Datei und legt sie im Branch ab, damit sie per CDN-Link im
# Smartphone-Browser getestet werden kann. Kann gelöscht werden, sobald die PRs
# gemergt sind und die Vorschau nicht mehr gebraucht wird.

on:
  push:
    branches: [vorschau]
    paths-ignore: ["dist-single/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vorschau-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Schreibtest (darf GITHUB_TOKEN pushen?)
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'schreibtest')
        run: |
          git config user.name "vibe-preview"
          git config user.email "noreply@mistral.ai"
          git commit --allow-empty -m "schreibtest: GITHUB_TOKEN darf pushen"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: SINGLE=1 npm run build
      - name: dist-single vorhanden?
        run: test -f dist-single/index.html
      - name: Single-File-Build committen
        run: |
          git config user.name "vibe-preview"
          git config user.email "noreply@mistral.ai"
          git add dist-single
          git commit -m "vorschau: single-file build"
          git push origin HEAD:${{ github.ref_name }}
